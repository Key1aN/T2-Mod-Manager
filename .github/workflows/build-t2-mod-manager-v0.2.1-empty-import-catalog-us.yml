name: Build T2 Mod Manager v0.2.1 Empty Import Catalog US

on:
  workflow_dispatch:
  push:
    branches: [codex/t2-mod-manager-v0.2.1-empty-import-catalog-us]
  pull_request:

jobs:
  build-test-package:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore T2-Mod-Manager.slnx
      - name: Build and retain uniquely named symbols
        run: dotnet build T2-Mod-Manager.slnx --configuration Release --no-restore
      - name: Run composable core safety tests
        run: dotnet run --project tests/T2ModManager.Core.Tests --configuration Release --no-build
      - name: Publish Windows x64 app
        run: dotnet publish src/T2ModManager.App --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/T2-Mod-Manager-v0.2.1-Empty-Import-Catalog-US
      - name: Write checksums
        shell: pwsh
        run: Get-ChildItem publish/T2-Mod-Manager-v0.2.1-Empty-Import-Catalog-US -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content publish/T2-Mod-Manager-v0.2.1-Empty-Import-Catalog-US/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: T2-Mod-Manager-v0.2.1-Empty-Import-Catalog-US-win-x64-run-${{ github.run_number }}
          path: publish/T2-Mod-Manager-v0.2.1-Empty-Import-Catalog-US
          if-no-files-found: error
